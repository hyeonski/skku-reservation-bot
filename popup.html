<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>교내 공간 예약 에이전트</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">SKKU SPACE AGENT</p>
          <h1>교내 예약</h1>
        </div>
        <button id="openPortalButton" class="icon-button" title="GLS 열기" aria-label="GLS 열기">
          <span aria-hidden="true">↗</span>
        </button>
      </header>

      <section id="chatLog" class="chat-log" aria-live="polite"></section>

      <section class="composer" aria-label="예약 요청 입력">
        <textarea
          id="requestInput"
          rows="2"
          placeholder="말하듯이 입력하세요. 예: 내일 6시 20명 회의실 잡아줘"
        ></textarea>
        <button id="parseButton" class="primary-button">보내기</button>
      </section>

      <section class="feedback" id="feedbackPanel" hidden>
        <div class="section-head">
          <h2>피드백</h2>
          <div class="rating-buttons" role="group" aria-label="추천 평가">
            <button class="rating-button" type="button" data-rating="5">좋음</button>
            <button class="rating-button" type="button" data-rating="1">아쉬움</button>
          </div>
        </div>
        <label>
          사유
          <select id="feedbackReasonInput">
            <option value="">선택 안 함</option>
            <option value="good_recommendation">추천이 적절함</option>
            <option value="bad_parse">요청 파싱 오류</option>
            <option value="bad_space">공간 추천 오류</option>
            <option value="too_slow">응답이 느림</option>
            <option value="form_error">폼 입력 오류</option>
            <option value="other">기타</option>
          </select>
        </label>
        <label>
          한줄 의견
          <input id="feedbackCommentInput" type="text" placeholder="예: 시간은 맞는데 건물이 멀어요" />
        </label>
        <button id="feedbackSubmitButton" class="ghost-button" type="button">피드백 보내기</button>
        <p id="feedbackMessage" class="feedback-message" aria-live="polite"></p>
      </section>

      <section class="defaults">
        <div class="section-head">
          <h2>반복 입력값</h2>
          <button id="saveDefaultsButton" class="ghost-button">기본값 저장</button>
        </div>
        <label>
          주관단체
          <input id="organizerInput" type="text" placeholder="예: 소프트웨어학과 학생회" />
        </label>
        <label>
          행사구분
          <select id="eventTypeInput">
            <option value="회의">회의</option>
            <option value="세미나">세미나</option>
            <option value="동아리">동아리</option>
            <option value="기타">기타</option>
          </select>
        </label>
      </section>
    </main>
    <script type="module" src="src/popup.js"></script>
  </body>
</html>
